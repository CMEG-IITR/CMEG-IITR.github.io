<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Data Explorer</title>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f8f9fb;
      color: #1f2937;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 20px;
    }

    /* Layout per material */
    .material-layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 16px;
      margin-bottom: 40px;
    }

    /* Outline */
    .outline {
      position: sticky;
      top: 20px;
      align-self: start;
      border-right: 1px solid #e5e7eb;
      padding-right: 12px;
      font-size: 0.85rem;
    }

    .outline-title {
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }

    .outline-item {
      margin-bottom: 4px;
    }

    .outline-item a {
      text-decoration: none;
      color: #1e40af;
    }

    .outline-item a:hover {
      text-decoration: underline;
    }

    /* Tree */
    details {
      margin-left: 12px;
      padding-left: 10px;
      border-left: 1px solid #e5e7eb;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      color: #1e40af;
    }

    summary:hover {
      background: #eef2ff;
    }

    .leaf {
      margin-left: 20px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .key {
      color: #1e40af;
    }

    .string {
      color: #374151;
    }

    .number {
      color: #065f46;
    }

    .boolean {
      color: #7c2d12;
    }

    .null {
      color: #9ca3af;
      font-style: italic;
    }
    .badge {
    color: #6b7280;
    font-size: 0.8rem;
    margin-left: 6px;
    }

    button {
    background: #f3f4f6;
    border: 1px solid #d1d5db;
    padding: 4px 8px;
    font-size: 0.85rem;
    cursor: pointer;
    }

    button:hover {
    background: #e5e7eb;
    }

  </style>
</head>

<body>
  <h1>Materials JSON Explorer</h1>
  <div id="root"></div>

  <script src="tree.js"></script>
</body>
</html>
